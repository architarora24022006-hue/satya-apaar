services:
  - type: web
    name: satya-apaar-backend
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SQLITE_FALLBACK
        value: "true"
      - key: CORS_ORIGINS
        value: "*"
      - key: API_V1_STR
        value: "/api/v1"
      - key: PROJECT_NAME
        value: "SATYA-APAAR"
